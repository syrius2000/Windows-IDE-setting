[project]
name = "rwd-ai-platform"
version = "1.0.0"
description = "Osaka University Statistical RWD & AI Agent Platform Foundation"
readme = "README.md"
requires-python = ">=3.12.14,<3.13"
dependencies = [
    "jsonschema>=4.20.0",
    "pyyaml>=6.0.1",
    "keyring>=24.0.0",
    "pymysql>=1.1.0",
    "pytest>=8.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
